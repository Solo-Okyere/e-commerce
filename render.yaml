services:
  - type: web
    name: ecommerce-frontend
    runtime: docker
    dockerContext: .
    dockerfilePath: frontend/Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: NEXT_PUBLIC_API_URL
        value: http://localhost:5000
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
