services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: free
    autoDeploy: true
    disk:
      name: ecommerce-db
      mountPath: /data
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/ecommerce.db
      - key: ADMIN_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DELIVERY_ESTIMATE
        value: Estimated delivery is within 3-5 business days after payment confirmation.

  - type: web
    name: ecommerce-frontend
    runtime: docker
    dockerContext: .
    dockerfilePath: frontend/Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: NEXT_PUBLIC_API_URL
        value: https://ecommerce-backend.onrender.com
