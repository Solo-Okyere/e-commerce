services:
  - type: web
    name: ecommerce-app
    runtime: docker
    rootDir: .
    dockerContext: .
    dockerfilePath: frontend/Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: INTERNAL_API_PORT
        value: "5001"
      - key: INTERNAL_API_ORIGIN
        value: http://127.0.0.1:5001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_LIVE_SECRET_KEY
        sync: false
      - key: PAYSTACK_TEST_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        value: https://fosogo.onrender.com/payment/callback
      - key: PAYSTACK_WEBHOOK_URL
        value: https://fosogo.onrender.com/api/payments/paystack/webhook
      - key: FRONTEND_URL
        value: https://fosogo.onrender.com
